<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>见微知兆 · 家属端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312705F'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E兆%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#1E2A28; --sub:#6B7F7A; --teal:#12705F; --teal2:#3E8F80;
    --alert:#FDF0E2; --brown:#7A450E; --user:#E7F1EE; --line:#E3ECE9;
    --panel:#F2F6F5; --white:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:#E9EFED; color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .app{
    width:100%; max-width:430px; height:100dvh; max-height:932px;
    background:var(--panel); display:flex; flex-direction:column; position:relative;
    overflow:hidden;
  }
  @media (min-width:520px){
    .app{height:min(880px,92vh); border-radius:28px; box-shadow:0 24px 60px rgba(18,42,36,.18); border:1px solid #DCE7E3}
  }

  /* header */
  header{
    padding:18px 18px 12px; background:var(--panel);
    display:flex; align-items:center; gap:10px; flex:none;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--teal);
    color:#fff; font-weight:700; font-size:17px; display:grid; place-items:center; flex:none;
    letter-spacing:0;
  }
  .who{flex:1; min-width:0}
  .who b{display:block; font-size:15.5px; font-weight:700; letter-spacing:.2px}
  .who span{display:block; font-size:11px; color:var(--sub); margin-top:2px}
  .live{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--teal2); font-weight:600}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--teal2); box-shadow:0 0 0 3px rgba(62,143,128,.14)}

  /* alert */
  .alert{
    margin:2px 18px 10px; background:var(--alert); border-radius:12px; flex:none;
    padding:10px 12px; display:flex; align-items:center; gap:9px;
  }
  .alert .beacon{width:8px; height:8px; border-radius:50%; background:#E8862E; flex:none}
  .alert .txt{flex:1; font-size:12px; color:var(--brown); font-weight:700; letter-spacing:.1px}
  .alert .tag{font-size:11px; color:var(--brown); opacity:.85}

  /* chat */
  main{
    flex:1; overflow-y:auto; padding:4px 18px 8px; scroll-behavior:smooth;
    display:flex; flex-direction:column; gap:10px;
  }
  main::-webkit-scrollbar{width:0}
  .day{align-self:flex-end; font-size:10.5px; color:var(--sub); margin:2px 2px 0}
  .row{display:flex; gap:8px; max-width:100%}
  .row.me{justify-content:flex-end}
  .bubble{
    max-width:82%; padding:11px 13px; font-size:13.5px; line-height:1.62;
    border-radius:14px; white-space:pre-wrap; word-break:break-word;
  }
  .row.bot .bubble{background:var(--teal); color:#fff; border-bottom-left-radius:6px}
  .row.me .bubble{background:var(--user); color:var(--ink); border-bottom-right-radius:6px}
  .row.bot .bubble a{color:#D8F0EA}
  .typing{display:inline-flex; gap:4px; align-items:center; height:14px}
  .typing i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.65); animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25; transform:translateY(0)}30%{opacity:1; transform:translateY(-2px)}}

  /* chips */
  .chips{
    flex:none; display:flex; gap:8px; padding:8px 18px 4px; overflow-x:auto; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; border:1px solid #CFE0DB; background:#fff; color:var(--teal);
    font-size:12px; padding:8px 12px; border-radius:999px; cursor:pointer;
    font-family:inherit; transition:.15s; white-space:nowrap;
  }
  .chip:hover{background:#EAF4F1; border-color:#B7D2CB}
  .chip:active{transform:scale(.97)}

  /* composer */
  .composer{
    flex:none; display:flex; align-items:center; gap:10px; padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    background:var(--panel);
  }
  .composer .box{
    flex:1; display:flex; align-items:center; background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:0 8px 0 16px; height:44px;
  }
  .composer input{
    flex:1; border:0; outline:0; font-size:14px; font-family:inherit; color:var(--ink); background:transparent;
  }
  .composer input::placeholder{color:#9AAEAA}
  .send{
    border:0; background:var(--teal); color:#fff; font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 18px; border-radius:999px; cursor:pointer; height:32px; line-height:14px;
  }
  .send:active{background:#0E5A4C}

  .foot{
    flex:none; text-align:center; font-size:10px; color:#93A6A1; padding:0 18px 8px;
    letter-spacing:.2px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">兆</div>
    <div class="who">
      <b>见微知兆 · 家属端</b>
      <span>在线 · 端侧推理 · 画面不外传</span>
    </div>
    <div class="live"><i class="dot"></i>已连接</div>
  </header>

  <div class="alert">
    <i class="beacon"></i>
    <div class="txt">14:32　卧室检测到疑似跌倒</div>
    <div class="tag">已推送</div>
  </div>

  <main id="chat">
    <div class="day">今天 14:32</div>
  </main>

  <div class="chips" id="chips"></div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="box">
      <input id="input" placeholder="发消息，或按住说话…" maxlength="120" />
    </div>
    <button class="send" type="submit">发送</button>
  </form>

  <div class="foot">见微知兆 · 居家养老无感异动感知机器人 · 演示环境</div>
</div>

<script>
(function () {
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const form = document.getElementById('composer');
  const chips = document.getElementById('chips');

  const PROMPTS = [
    {
      label: '巡检任务',
      q: '按当前地图开始一轮全屋巡检，重点检查卧室和卫生间。',
      a: '已规划 4 个点位：客厅 → 卧室 → 卫生间 → 厨房，均为重点区域。卧室未见人倒地，卫生间地面干燥、无杂物；20:41 已返回充电位。'
    },
    {
      label: '处置逻辑',
      q: '如果奶奶在卫生间门口一直不动，你会怎么处理？',
      a: '① 停在 1.5 米外，语音呼叫 3 次、每次间隔 5 秒；② 无应答推送家属并拨打预留电话；③ 60 秒仍无起身则呼叫 120、同步社区。全程不上传画面。'
    },
    {
      label: '状态摘要',
      q: '对比上周，奶奶这周的活动有什么变化？',
      a: '日均活动 3.1 小时（−18%），夜间如厕 5 次（+2），久坐峰值 96 分钟（上周 71 分钟），活动范围缩至客厅—卧室。建议先关注下肢力量与睡眠。'
    }
  ];

  const RULES = [
    { k: ['巡检', '巡视', '检查', '巡逻'], a: PROMPTS[0].a },
    { k: ['跌倒', '摔倒', '不动', '倒地', '起不来'], a: PROMPTS[1].a },
    { k: ['上周', '变化', '对比', '这周', '趋势'], a: PROMPTS[2].a },
    { k: ['吃饭', '餐', '午饭', '饭'], a: '11:30–12:20 厨房检测到 2 次停留，但未识别到取餐动作。已把提醒发到您手机，建议 12:30 前电话确认。' },
    { k: ['睡', '起床', '离床', '夜里', '夜间'], a: '昨晚 22:40 入睡，夜间离床 2 次（01:12、04:35），每次约 4 分钟；今早 8:10 起床，较平日晚 35 分钟，其余正常。' },
    { k: ['你好', '在吗', 'hello', 'hi'], a: '我在。可以问我三类问题：① 巡检任务 ② 异常处置 ③ 活动状态摘要；也可以点下面的示例问题。' }
  ];

  const FALLBACK = '我可以回答三类问题：① 巡检任务 ② 异常处置 ③ 活动状态摘要。也可以直接点下面的示例问题。';

  function scrollDown() {
    requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; });
  }

  function bubble(who, text) {
    const row = document.createElement('div');
    row.className = 'row ' + (who === 'me' ? 'me' : 'bot');
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    chat.appendChild(row);
    scrollDown();
    return b;
  }

  function reply(text) {
    const b = bubble('bot', '');
    b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    setTimeout(function () {
      b.textContent = text;
      scrollDown();
    }, 620);
  }

  function answer(q) {
    const s = q.toLowerCase();
    for (let i = 0; i < RULES.length; i++) {
      for (let j = 0; j < RULES[i].k.length; j++) {
        if (s.indexOf(RULES[i].k[j]) !== -1) return RULES[i].a;
      }
    }
    return FALLBACK;
  }

  function send(text) {
    const t = (text || '').trim();
    if (!t) return;
    bubble('me', t);
    input.value = '';
    reply(answer(t));
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send(input.value);
  });

  PROMPTS.forEach(function (p) {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip';
    c.textContent = p.label;
    c.addEventListener('click', function () {
      bubble('me', p.q);
      reply(p.a);
    });
    chips.appendChild(c);
  });

  // opening scene from the deck
  bubble('me', '奶奶怎么了？');
  setTimeout(function () {
    reply('14:32 在卧室检测到疑似跌倒，已在她身边语音提醒 3 次无应答。机器人停在 1.5 米外持续观察，画面未上传；已同步推送给您和社区值班室。');
  }, 500);
  setTimeout(function () {
    bubble('me', '我 10 分钟到家，先别惊动她。');
    setTimeout(function () {
      reply('收到，已切换静默观察。若 60 秒内仍无起身动作，将自动呼叫 120 并同步社区；您到家后可语音接管。');
    }, 400);
  }, 1600);
})();
</script>
</body>
</html>
